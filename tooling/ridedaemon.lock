# Rebuilt 2026-09-05 on top of 6690e77 (clock-ack-uses-host-timezone-offset).
# After CLIENT_INFO, if currentHUTime still looks like boot/uptime (< 1e11 ms)
# and the dash does not send 0x10450 within 2s, hudlib pushes the same
# QUERY_TIME_ACK JSON the solicited path already sends. A Voge that asks
# 0x10450 (the common handshake) is unchanged: that answer cancels the wait
# and no second packet goes out. Binding surface vs previous AAR: identical.
