# 2048m was starving R8. The release path is where the build time goes - obfuscation, resource
# shrinking and stringfog run only there - and R8 spent it collecting garbage inside a 2GB
# ceiling on a 32GB machine. Metaspace is capped separately so the daemon cannot creep.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Ten cores, and the build is more than one module.
org.gradle.parallel=true

# The worktrees are the same project: with the cache on, what one of them compiles the next
# one reuses instead of redoing it from scratch.
org.gradle.caching=true

# Deliberately NOT enabling org.gradle.configuration-cache: exportPublicApk and
# exportPrivateAndroidAutoApk read project state at execution time (zipTree over the copied
# APK, destinationDir), which the configuration cache rejects. Those tasks are the release
# safety net - the ones that refuse to publish an unobfuscated build or leak the Android Auto
# identity - and must not be weakened to save seconds.

android.useAndroidX=true
android.enableResourceOptimizations=false
kotlin.code.style=official

# Local Android Studio / assembleDebug builds: pack aa_cert + aa_identity_data from
# ../../tooling/private/android-auto/ when those files are present. Public export
# tasks still refuse this flag. Keep tooling/private/ gitignored.
includeAndroidAutoIdentity=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
